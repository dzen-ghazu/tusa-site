# Define your media locations
media:
  - name: logos
    label: Logos
    input: tusa-site/docs/images/logos
    output: /images/logos

  - name: club_admin
    label: Club Admin Guide Media
    input: tusa-site/docs/club-admin-guide/media
    output: /club-admin-guide/media

  - name: general_docs
    label: General Page Media
    input: tusa-site/docs
    output: /

# Define your content collections
content:
  - name: club_admin_guide
    label: Club Admin Guide
    type: collection
    path: tusa-site/docs/club-admin-guide
    fields:
      - name: title
        type: string
      - name: body
        type: rich-text
