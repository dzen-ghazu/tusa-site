
content:
  - name: docs
    label: Documentation
    type: collection
    path: docs # or path where your .md files live
    fields:
      - name: title
        type: string
      - name: body
        type: rich-text

# Define your media locations
media:
  - name: logos
    label: Logos
    input: tusa-site/docs/images/logos
    output: /images/logos

  - name: club_admin
    label: Club Admin Guide Media
    input: tusa-site/docs/club-admin-guide/media
    output: /club-admin-guide/media

  - name: general_docs
    label: General Page Media
    input: tusa-site/docs
    output: /
