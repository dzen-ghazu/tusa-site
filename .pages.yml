# Media configuration allowing you to browse/upload across your media folders
media:
  - name: docs_media
    label: Docs Folder (Browse All Subfolders)
    input: docs
    output: /

  - name: logos
    label: Logos Folder
    input: docs/images/logos
    output: /images/logos

  - name: club_admin_media
    label: Club Admin Guide Media
    input: docs/club-admin-guide/media
    output: /club-admin-guide/media

# Content Collections
content:
  - name: docs
    label: All Documentation
    type: collection
    path: docs
    exclude:
      - "**/media/**"
      - "**/images/**"
    fields:
      - name: title
        label: Title
        type: string
      - name: body
        label: Page Content
        type: rich-text
        options:
            headings: [1, 2, 3]
            image: true
            table: true
            link: true
